name: Test Food Truth Scanner

on:
  push:
    paths:
      - "*.js"
      - "tests/**"
      - "index.html"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "*.js"
      - "tests/**"
      - "index.html"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check runtime syntax
        run: |
          for file in *.js; do
            node --check "$file"
          done
      - name: Run scoring parity regressions
        run: node tests/scoring-parity.test.js
      - name: Run Open Food Facts adapter regressions
        run: node tests/off-adapter.test.js
      - name: Guard browser composition architecture
        run: node tests/architecture.test.js
