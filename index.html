<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Food Truth Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260824-1" />
<link rel="stylesheet" href="off-styles.css?v=20260824-2" />
<style>
  /* Keep overlays opaque throughout transitions so an OFF loading/result
     state never exposes the underlying home screen between renders. */
  .overlay { animation: foodTruthOverlaySlide 0.18s ease !important; }
  @keyframes foodTruthOverlaySlide {
    from { transform: translateY(10px); opacity: 1; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>
  <div id="phone-frame">
    <div id="app"></div>
  </div>

  <!-- html5-qrcode: live camera barcode scanning (progressive enhancement —
       manual entry and browse are the guaranteed paths, see spec Flow A). -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="scoring.js"></script>
  <script src="profile.js"></script>
  <script src="data.js"></script>
  <script src="catalog-overrides.js"></script>
  <script src="open-food-facts.js?v=20260824-3"></script>
  <script src="app.js"></script>
  <script src="off-runtime.js?v=20260824-3"></script>
  <script src="personalization.js?v=20260824-1"></script>
  <script src="branding.js"></script>
</body>
</html>
